<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora AI</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
:root {
    --bg: linear-gradient(135deg, #e8f1ff 0%, #f5ecff 50%, #e7f8ff 100%);
    --text: #182033;
    --sidebar: rgba(255,255,255,0.78);
    --hover: rgba(80,120,255,0.12);
    --border: rgba(100,130,180,0.18);
    --welcome: #243b64;
    --user: linear-gradient(135deg, #4f7cff, #7b61ff);
    --bot: rgba(255,255,255,0.82);
    --input: rgba(255,255,255,0.78);
    --tool: #667085;
    --glow: rgba(79,124,255,0.28);
}

[data-theme="dark"] {
    --bg: linear-gradient(135deg, #090b16 0%, #10172b 50%, #17102b 100%);
    --text: #eef2ff;
    --sidebar: rgba(18,22,38,0.88);
    --hover: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.10);
    --welcome: #dce6ff;
    --user: linear-gradient(135deg, #3f6df6, #8b5cf6);
    --bot: rgba(255,255,255,0.07);
    --input: rgba(255,255,255,0.08);
    --tool: #aab4cf;
    --glow: rgba(104,92,255,0.35);
}

* {
    box-sizing: border-box;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
}

html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
}

/* Background glow */
body::before,
body::after {
    content: "";
    position: fixed;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    pointer-events: none;
    z-index: -1;
}

body::before {
    top: -100px;
    left: -80px;
    background: #5b7cfa;
}

body::after {
    right: -100px;
    bottom: -100px;
    background: #a855f7;
}

/* Header */
.header {
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(16px);
    background: rgba(255,255,255,0.04);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.3px;
}

/* Buttons */
button {
    cursor: pointer;
    transition: 0.2s ease;
}

.icon-btn {
    border: 1px solid transparent;
    background: transparent;
    color: var(--tool);
    font-size: 18px;
    width: 40px;
    height: 40px;
    border-radius: 14px;
}

.icon-btn:hover {
    background: var(--hover);
    transform: translateY(-1px);
}

/* Sidebar */
.sidebar {
    position: fixed;
    top: 0;
    left: -310px;
    width: 290px;
    height: 100%;
    background: var(--sidebar);
    backdrop-filter: blur(24px);
    z-index: 10;
    transition: left .3s ease;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    box-shadow: 10px 0 40px rgba(0,0,0,0.12);
}

.sidebar.show {
    left: 0;
}

.sidebar-header {
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
}

.sidebar-content {
    padding: 15px;
    flex: 1;
    overflow-y: auto;
}

.new-chat {
    width: 100%;
    padding: 13px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--hover);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
}

.new-chat:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px var(--glow);
}

.history-title {
    margin: 22px 0 8px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--tool);
}

.history-item {
    padding: 11px 12px;
    border-radius: 12px;
    margin-bottom: 6px;
    cursor: pointer;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.history-item:hover {
    background: var(--hover);
}

/* Profile */
.sidebar-footer {
    padding: 18px;
    border-top: 1px solid var(--border);
}

.profile {
    display: flex;
    gap: 10px;
    align-items: center;
}

.avatar-small {
    width: 38px;
    height: 38px;
    border-radius: 13px;
    background: linear-gradient(135deg, #4f7cff, #8b5cf6);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    box-shadow: 0 5px 18px var(--glow);
}

/* Main */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 850px;
    width: 100%;
    margin: auto;
    min-height: 0;
}

/* Welcome */
.welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.sparkle {
    width: 72px;
    height: 72px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    background: linear-gradient(135deg, #4f7cff, #8b5cf6, #d946ef);
    font-size: 29px;
    margin-bottom: 18px;
    box-shadow: 0 15px 45px var(--glow);
}

.welcome h1 {
    color: var(--welcome);
    font-size: 26px;
    font-weight: 650;
    margin: 0;
}

/* Messages */
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px;
    display: none;
    flex-direction: column;
    gap: 18px;
}

.messages.active {
    display: flex;
}

.row {
    display: flex;
    gap: 10px;
    animation: messageIn .25s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.row.user {
    justify-content: flex-end;
}

.row.bot {
    justify-content: flex-start;
}

.message-avatar {
    width: 38px;
    height: 38px;
    border-radius: 14px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

.user-avatar {
    background: linear-gradient(135deg, #4f7cff, #3b82f6);
}

.bot-avatar {
    background: linear-gradient(135deg, #4f7cff, #8b5cf6, #d946ef);
    box-shadow: 0 5px 20px var(--glow);
}

.bubble {
    max-width: 75%;
    padding: 13px 17px;
    border-radius: 18px;
    line-height: 1.65;
    word-break: break-word;
    backdrop-filter: blur(10px);
}

.user .bubble {
    background: var(--user);
    color: white;
    border-bottom-right-radius: 5px;
    box-shadow: 0 8px 25px var(--glow);
}

.bot .bubble {
    background: var(--bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.05);
}

.bot-wrapper {
    max-width: 75%;
}

.bot-wrapper .bubble {
    max-width: 100%;
}

.actions {
    margin-top: 6px;
    display: flex;
    gap: 8px;
}

.action-btn {
    border: none;
    background: transparent;
    color: var(--tool);
    padding: 6px 8px;
    border-radius: 9px;
    font-size: 13px;
}

.action-btn:hover {
    background: var(--hover);
}

/* Input */
.input-area {
    padding: 12px 20px 28px;
}

.input-box {
    display: flex;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 6px;
    backdrop-filter: blur(20px);
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    transition: .2s ease;
}

.input-box:focus-within {
    border-color: rgba(100,120,255,0.55);
    box-shadow: 0 0 0 4px var(--glow);
}

input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 11px 14px;
    font-size: 16px;
    color: var(--text);
}

input::placeholder {
    color: var(--tool);
}

.send {
    width: 46px;
    height: 46px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, #4f7cff, #8b5cf6);
    color: white;
    font-size: 16px;
    box-shadow: 0 8px 22px var(--glow);
}

.send:hover {
    transform: translateY(-2px) scale(1.03);
}

/* Mobile */
@media(max-width:600px) {

    .header {
        padding: 10px 12px;
    }

    .main {
        width: 100%;
    }

    .welcome h1 {
        font-size: 22px;
    }

    .bubble,
    .bot-wrapper {
        max-width: 88%;
    }

    .messages {
        padding: 16px 12px;
    }

    .input-area {
        padding: 10px 12px 20px;
    }

    .sidebar {
        width: 280px;
    }

}
</style>
</head>

<body data-theme="light">

    <div class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <b>Aurora AI</b>

            <button class="icon-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="sidebar-content">

            <button class="new-chat" onclick="newChat()">
                <i class="fa-solid fa-plus"></i>
                New chat
            </button>

            <div class="history-title">
                RECENT
            </div>

            <div id="history"></div>

        </div>

        <div class="sidebar-footer">

            <div class="profile">

                <div class="avatar-small">I</div>

                <span>Itz Raviteja</span>

            </div>

        </div>

    </div>


    <div class="header">

        <div class="header-left">

            <button class="icon-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="title">
                Aurora AI
            </div>

        </div>

        <button class="icon-btn" onclick="toggleTheme()">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>

    </div>


    <div class="main">

        <div class="welcome" id="welcome">

            <div class="sparkle">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>

            <h1>హాయ్ రవి, ఈరోజు ఏం చేయాలి?</h1>

        </div>


        <div class="messages" id="messages"></div>


        <div class="input-area">

            <div class="input-box">

                <input
                    id="input"
                    placeholder="Ask Aurora AI"
                    onkeydown="handleKey(event)"
                >

                <button class="send" onclick="sendMessage()">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>

            </div>

        </div>

    </div>


<script>

const chats = [];

let currentChat = null;


function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .toggle("show");

}


function toggleTheme() {

    const body = document.body;

    const theme =
        body.getAttribute("data-theme");

    if (theme === "light") {

        body.setAttribute("data-theme","dark");

        document
            .getElementById("themeIcon")
            .className =
            "fa-solid fa-sun";

    } else {

        body.setAttribute("data-theme","light");

        document
            .getElementById("themeIcon")
            .className =
            "fa-solid fa-moon";

    }

}


function newChat() {

    currentChat = {
        title: "New Chat",
        messages: []
    };

    chats.unshift(currentChat);

    document
        .getElementById("messages")
        .innerHTML = "";

    document
        .getElementById("welcome")
        .style.display = "flex";

    document
        .getElementById("messages")
        .classList.remove("active");

    renderHistory();

}


function renderHistory() {

    const history =
        document.getElementById("history");

    history.innerHTML = "";

    chats.forEach(chat => {

        const item =
            document.createElement("div");

        item.className =
            "history-item";

        item.innerText =
            chat.title;

        item.onclick = () => {

            currentChat = chat;

            loadChat();

            toggleSidebar();

        };

        history.appendChild(item);

    });

}


function loadChat() {

    const container =
        document.getElementById("messages");

    container.innerHTML = "";

    currentChat.messages.forEach(msg => {

        appendMessage(
            msg.text,
            msg.role
        );

    });

}


function appendMessage(text, role) {

    const container =
        document.getElementById("messages");

    const row =
        document.createElement("div");

    row.className =
        "row " + role;


    if (role === "user") {

        row.innerHTML = `
            <div class="bubble"></div>
        `;

        row
            .querySelector(".bubble")
            .innerText = text;

    } else {

        row.innerHTML = `

            <div class="message-avatar bot-avatar">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>

            <div class="bot-wrapper">

                <div class="bubble"></div>

                <div class="actions">

                    <button class="action-btn">
                        <i class="fa-solid fa-volume-high"></i>
                        విను
                    </button>

                    <button class="action-btn">
                        <i class="fa-solid fa-copy"></i>
                        కాపీ
                    </button>

                </div>

            </div>

        `;

        row
            .querySelector(".bubble")
            .innerText = text;


        const buttons =
            row.querySelectorAll(".action-btn");


        buttons[0].onclick = () => {

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "te-IN";

            speechSynthesis.speak(speech);

        };


        buttons[1].onclick = () => {

            navigator.clipboard.writeText(text);

        };

    }


    container.appendChild(row);

    document
        .getElementById("welcome")
        .style.display = "none";

    container
        .classList
        .add("active");

    container.scrollTop =
        container.scrollHeight;

}


function handleKey(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

}


async function sendMessage() {

    const input =
        document.getElementById("input");

    const message =
        input.value.trim();


    if (!message) return;


    if (!currentChat) {

        currentChat = {
            title:
                message.substring(0,30),
            messages: []
        };

        chats.unshift(currentChat);

        renderHistory();

    }


    appendMessage(
        message,
        "user"
    );


    currentChat.messages.push({
        role:"user",
        text:message
    });


    input.value = "";


    const loading =
        document.createElement("div");

    loading.className =
        "row bot";

    loading.id =
        "loading";

    loading.innerHTML = `
        <div class="message-avatar bot-avatar">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>

        <div class="bot-wrapper">

            <div class="bubble">
                ఆలోచిస్తోంది...
            </div>

        </div>
    `;


    document
        .getElementById("messages")
        .appendChild(loading);


    try {

        const response =
            await fetch("/chat", {

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    message:message

                })

            });


        const data =
            await response.json();


        document
            .getElementById("loading")
            ?.remove();


        if (
            response.ok &&
            data.reply
        ) {

            appendMessage(
                data.reply,
                "bot"
            );


            currentChat.messages.push({

                role:"bot",
                text:data.reply

            });

        }

        else {

            appendMessage(
                "ఎర్రర్: " +
                (data.detail ||
                "సమాధానం రాలేదు"),
                "bot"
            );

        }

    }

    catch(error) {

        document
            .getElementById("loading")
            ?.remove();


        appendMessage(
            "నెట్‌వర్క్ లోపం: " +
            error.message,
            "bot"
        );

    }

}

</script>

</body>
</html>
