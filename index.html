<!DOCTYPE html><html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Aurora Smart AI</title>

<link rel="icon" type="image/png" href="/file_00000000382c8208810f019a9f847a9e.png">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

    :root {
        --bg: linear-gradient(180deg, #eaf4ff 0%, #d9e9ff 100%);
        --text: #202124;
        --sidebar: rgba(255,255,255,0.96);
        --hover: #eef4fb;
        --border: rgba(0,0,0,0.08);
        --welcome: #16345f;
        --user: linear-gradient(135deg, #4285f4, #6c63ff);
        --bot: rgba(255,255,255,0.92);
        --input: rgba(255,255,255,0.96);
        --tool: #6b7280;
        --accent: #4285f4;
        --accent2: #8b5cf6;
    }

    [data-theme="dark"] {
        --bg: linear-gradient(180deg, #0b1020 0%, #151a2c 100%);
        --text: #f3f4f6;
        --sidebar: rgba(20,25,40,0.98);
        --hover: rgba(255,255,255,0.07);
        --border: rgba(255,255,255,0.10);
        --welcome: #dbeafe;
        --user: linear-gradient(135deg, #2563eb, #7c3aed);
        --bot: rgba(35,40,55,0.95);
        --input: rgba(35,40,55,0.95);
        --tool: #aeb7c5;
        --accent: #60a5fa;
        --accent2: #a78bfa;
    }

    * {
        box-sizing: border-box;
        font-family: 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
    }

    body {
        display: flex;
        flex-direction: column;
    }

    button {
        cursor: pointer;
        font-family: inherit;
    }

    /* HEADER */

    .header {
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .title {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.2px;
    }

    .icon-btn {
        border: none;
        background: transparent;
        color: var(--tool);
        font-size: 18px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        transition: 0.2s;
    }

    .icon-btn:hover {
        background: var(--hover);
        transform: scale(1.05);
    }

    /* SIDEBAR */

    .sidebar {
        position: fixed;
        top: 0;
        left: -300px;
        width: 285px;
        height: 100%;
        background: var(--sidebar);
        z-index: 100;
        transition: left 0.3s ease;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        backdrop-filter: blur(18px);
    }

    .sidebar.show {
        left: 0;
    }

    .sidebar-header {
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
    }

    .brand-side {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
    }

    .brand-mini {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        object-fit: cover;
    }

    .sidebar-content {
        padding: 15px;
        flex: 1;
        overflow-y: auto;
    }

    .new-chat {
        width: 100%;
        padding: 13px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: white;
        font-size: 15px;
        font-weight: 600;
    }

    .history-title {
        margin: 22px 0 10px;
        font-size: 12px;
        color: var(--tool);
        font-weight: 700;
        letter-spacing: 1px;
    }

    .history-item {
        padding: 11px 12px;
        border-radius: 12px;
        margin-bottom: 6px;
        cursor: pointer;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        transition: 0.2s;
    }

    .history-item:hover {
        background: var(--hover);
    }

    .sidebar-footer {
        padding: 16px;
        border-top: 1px solid var(--border);
    }

    .profile {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .avatar-small {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
    }

    /* MAIN */

    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        max-width: 850px;
        width: 100%;
        margin: auto;
        min-height: 0;
    }

    /* WELCOME */

    .welcome {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
    }

    .welcome-card {
        width: min(100%, 560px);
        padding: 34px 26px;
        border-radius: 30px;
        text-align: center;
        background: rgba(255,255,255,0.72);
        border: 1px solid rgba(255,255,255,0.9);
        box-shadow: 0 25px 70px rgba(66,133,244,0.20);
        backdrop-filter: blur(20px);
    }

    [data-theme="dark"] .welcome-card {
        background: rgba(25,30,45,0.82);
        border-color: rgba(255,255,255,0.10);
        box-shadow: 0 25px 70px rgba(0,0,0,0.35);
    }

    .app-logo {
        width: 105px;
        height: 105px;
        object-fit: contain;
        border-radius: 25px;
        margin-bottom: 14px;
        filter: drop-shadow(0 12px 25px rgba(66,133,244,0.35));
    }

    .welcome-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 15px;
        border-radius: 22px;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent2);
        background: rgba(139,92,246,0.12);
        margin-bottom: 12px;
    }

    .welcome-card h1 {
        color: var(--welcome);
        margin: 7px 0 10px;
        font-size: 29px;
    }

    .welcome-card p {
        margin: 0 auto 24px;
        max-width: 430px;
        line-height: 1.7;
        color: var(--tool);
    }

    .quick-prompts {
        display: grid;
        gap: 10px;
    }

    .quick-prompts button {
        border: 1px solid var(--border);
        background: var(--hover);
        color: var(--text);
        padding: 14px 16px;
        border-radius: 16px;
        font-size: 14px;
        text-align: left;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .quick-prompts button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    /* MESSAGES */

    .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: none;
        flex-direction: column;
        gap: 16px;
    }

    .messages.active {
        display: flex;
    }

    .row {
        display: flex;
        gap: 10px;
    }

    .row.user {
        justify-content: flex-end;
    }

    .row.bot {
        justify-content: flex-start;
    }

    .message-avatar {
        width: 38px;
        height: 38px;
        border-radius: 13px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    .user-avatar {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
    }

    .bot-avatar {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
    }

    .bubble {
        max-width: 75%;
        padding: 13px 17px;
        border-radius: 18px;
        line-height: 1.65;
        word-break: break-word;
    }

    .user .bubble {
        background: var(--user);
        color: white;
        border-bottom-right-radius: 5px;
    }

    .bot .bubble {
        background: var(--bot);
        border: 1px solid var(--border);
        border-bottom-left-radius: 5px;
    }

    .bot-wrapper {
        max-width: 75%;
    }

    .bot-wrapper .bubble {
        max-width: 100%;
    }

    .actions {
        margin-top: 7px;
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
    }

    .action-btn {
        border: none;
        background: var(--hover);
        color: var(--tool);
        padding: 7px 10px;
        border-radius: 10px;
        font-size: 12px;
    }

    /* INPUT */

    .input-area {
        padding: 10px 20px 28px;
    }

    .input-box {
        display: flex;
        align-items: center;
        background: var(--input);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 6px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.06);
    }

    input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        padding: 11px 14px;
        font-size: 16px;
        color: var(--text);
        min-width: 0;
    }

    .mic {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: none;
        background: transparent;
        color: var(--tool);
        font-size: 17px;
    }

    .mic.listening {
        color: #ef4444;
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        50% {
            transform: scale(1.12);
        }
    }

    .send {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: white;
        font-size: 16px;
    }

    /* MOBILE */

    @media(max-width:600px) {

        .header {
            padding: 10px 12px;
        }

        .title {
            font-size: 17px;
        }

        .welcome {
            padding: 14px;
        }

        .welcome-card {
            padding: 25px 18px;
            border-radius: 25px;
        }

        .app-logo {
            width: 90px;
            height: 90px;
        }

        .welcome-card h1 {
            font-size: 25px;
        }

        .bubble,
        .bot-wrapper {
            max-width: 86%;
        }

        .messages {
            padding: 14px;
        }

        .input-area {
            padding: 8px 12px 20px;
        }

        .quick-prompts button {
            padding: 12px 14px;
        }
    }

</style>

</head><body data-theme="light"><!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

    <div class="sidebar-header">

        <div class="brand-side">

            <img
                src="/file_00000000382c8208810f019a9f847a9e.png"
                class="brand-mini"
                alt="Aurora Smart AI"
            >

            <span>Aurora Smart AI</span>

        </div>

        <button class="icon-btn" onclick="toggleSidebar()">
            <i class="fa-solid fa-xmark"></i>
        </button>

    </div>

    <div class="sidebar-content">

        <button class="new-chat" onclick="newChat()">
            <i class="fa-solid fa-plus"></i>
            New Chat
        </button>

        <div class="history-title">
            RECENT CHATS
        </div>

        <div id="history"></div>

    </div>

    <div class="sidebar-footer">

        <div class="profile">

            <div class="avatar-small">R</div>

            <span>Itz Raviteja</span>

        </div>

    </div>

</div>


<!-- HEADER -->

<div class="header">

    <div class="header-left">

        <button class="icon-btn" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="title">
            Aurora Smart AI
        </div>

    </div>

    <button class="icon-btn" onclick="toggleTheme()">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>

</div>


<!-- MAIN -->

<div class="main">


    <!-- PREMIUM WELCOME -->

    <div class="welcome" id="welcome">

        <div class="welcome-card">

            <img
                src="/file_00000000382c8208810f019a9f847a9e.png"
                alt="Aurora Smart AI"
                class="app-logo"
            >

            <div class="welcome-badge">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                Aurora Smart AI
            </div>

            <h1>హాయ్ రవి! 👋</h1>

            <p>
                మీకు ఏ విషయంలో సహాయం కావాలి?
                Aurora Smart AI మీ కోసం సిద్ధంగా ఉంది.
            </p>

            <div class="quick-prompts">

                <button onclick="setPrompt('ఈరోజు ఏం చేయాలి?')">
                    ✨ ఈరోజు ఏం చేయాలి?
                </button>

                <button onclick="setPrompt('నాకు ఒక మంచి ఐడియా చెప్పండి')">
                    💡 నాకు ఒక మంచి ఐడియా చెప్పండి
                </button>

                <button onclick="setPrompt('నాకు Python నేర్పండి')">
                    🚀 నాకు Python నేర్పండి
                </button>

            </div>

        </div>

    </div>


    <!-- MESSAGES -->

    <div class="messages" id="messages"></div>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-box">

            <input
                id="input"
                placeholder="Ask Aurora Smart AI..."
                onkeydown="handleKey(event)"
            >

            <button class="mic" id="micBtn" onclick="startVoice()">
                <i class="fa-solid fa-microphone"></i>
            </button>

            <button class="send" onclick="sendMessage()">
                <i class="fa-solid fa-arrow-up"></i>
            </button>

        </div>

    </div>

</div>

<script>

    const chats = [];

    let currentChat = null;


    /* SIDEBAR */

    function toggleSidebar() {

        document
            .getElementById("sidebar")
            .classList
            .toggle("show");

    }


    /* THEME */

    function toggleTheme() {

        const body = document.body;

        const theme =
            body.getAttribute("data-theme");

        if (theme === "light") {

            body.setAttribute("data-theme", "dark");

            document
                .getElementById("themeIcon")
                .className =
                "fa-solid fa-sun";

        } else {

            body.setAttribute("data-theme", "light");

            document
                .getElementById("themeIcon")
                .className =
                "fa-solid fa-moon";

        }

    }


    /* QUICK PROMPT */

    function setPrompt(text) {

        const input =
            document.getElementById("input");

        input.value = text;

        input.focus();

    }


    /* NEW CHAT */

    function newChat() {

        currentChat = {
            title: "New Chat",
            messages: []
        };

        chats.unshift(currentChat);

        document
            .getElementById("messages")
            .innerHTML = "";

        document
            .getElementById("welcome")
            .style.display = "flex";

        document
            .getElementById("messages")
            .classList
            .remove("active");

        renderHistory();

        toggleSidebar();

    }


    /* HISTORY */

    function renderHistory() {

        const history =
            document.getElementById("history");

        history.innerHTML = "";

        chats.forEach(chat => {

            const item =
                document.createElement("div");

            item.className =
                "history-item";

            item.innerText =
                chat.title;

            item.onclick = () => {

                currentChat = chat;

                loadChat();

                toggleSidebar();

            };

            history.appendChild(item);

        });

    }


    function loadChat() {

        const container =
            document.getElementById("messages");

        container.innerHTML = "";

        document
            .getElementById("welcome")
            .style.display = "none";

        container
            .classList
            .add("active");

        currentChat.messages.forEach(msg => {

            appendMessage(
                msg.text,
                msg.role
            );

        });

    }


    /* MESSAGE */

    function appendMessage(text, role) {

        const container =
            document.getElementById("messages");

        const row =
            document.createElement("div");

        row.className =
            "row " + role;


        if (role === "user") {

            row.innerHTML = `
                <div class="bubble"></div>
            `;

            row
                .querySelector(".bubble")
                .innerText = text;

        }

        else {

            row.innerHTML = `

                <div class="message-avatar bot-avatar">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>

                <div class="bot-wrapper">

                    <div class="bubble"></div>

                    <div class="actions">

                        <button class="action-btn listen-btn">
                            <i class="fa-solid fa-volume-high"></i>
                            విను
                        </button>

                        <button class="action-btn copy-btn">
                            <i class="fa-solid fa-copy"></i>
                            కాపీ
                        </button>

                        <button class="action-btn share-btn">
                            <i class="fa-solid fa-share-nodes"></i>
                            Share
                        </button>

                    </div>

                </div>

            `;

            row
                .querySelector(".bubble")
                .innerText = text;


            const listenBtn =
                row.querySelector(".listen-btn");

            const copyBtn =
                row.querySelector(".copy-btn");

            const shareBtn =
                row.querySelector(".share-btn");


            listenBtn.onclick = () => {

                speechSynthesis.cancel();

                const speech =
                    new SpeechSynthesisUtterance(text);

                speech.lang = "te-IN";

                speechSynthesis.speak(speech);

            };


            copyBtn.onclick = async () => {

                try {

                    await navigator
                        .clipboard
                        .writeText(text);

                    copyBtn.innerHTML =
                        '<i class="fa-solid fa-check"></i> Copied';

                    setTimeout(() => {

                        copyBtn.innerHTML =
                            '<i class="fa-solid fa-copy"></i> కాపీ';

                    }, 1500);

                }

                catch {

                    alert("Copy చేయలేకపోయాము");

                }

            };


            shareBtn.onclick = async () => {

                if (navigator.share) {

                    try {

                        await navigator.share({
                            title: "Aurora Smart AI",
                            text: text
                        });

                    }

                    catch(error) {

                    }

                }

                else {

                    await navigator
                        .clipboard
                        .writeText(text);

                    alert("Share supported కాదు. Text copy అయింది.");

                }

            };

        }


        container.appendChild(row);

        document
            .getElementById("welcome")
            .style.display = "none";

        container
            .classList
            .add("active");

        container.scrollTop =
            container.scrollHeight;

    }


    /* ENTER */

    function handleKey(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }


    /* VOICE */

    function startVoice() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            alert(
                "ఈ browserలో Voice Input support లేదు."
            );

            return;

        }


        const recognition =
            new SpeechRecognition();

        recognition.lang =
            "te-IN";

        recognition.interimResults =
            false;


        const micBtn =
            document.getElementById("micBtn");


        recognition.onstart = () => {

            micBtn
                .classList
                .add("listening");

        };


        recognition.onend = () => {

            micBtn
                .classList
                .remove("listening");

        };


        recognition.onresult = event => {

            document
                .getElementById("input")
                .value =
                event.results[0][0].transcript;

        };


        recognition.start();

    }


    /* SEND MESSAGE */

    async function sendMessage() {

        const input =
            document.getElementById("input");

        const message =
            input.value.trim();


        if (!message) return;


        if (!currentChat) {

            currentChat = {
                title:
                    message.substring(0, 30),
                messages: []
            };

            chats.unshift(currentChat);

            renderHistory();

        }


        appendMessage(
            message,
            "user"
        );


        currentChat.messages.push({
            role: "user",
            text: message
        });


        input.value = "";


        const loading =
            document.createElement("div");

        loading.className =
            "row bot";

        loading.id =
            "loading";

        loading.innerHTML = `

            <div class="message-avatar bot-avatar">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>

            <div class="bot-wrapper">

                <div class="bubble">
                    ఆలోచిస్తోంది...
                </div>

            </div>

        `;


        document
            .getElementById("messages")
            .appendChild(loading);


        const container =
            document.getElementById("messages");

        container.scrollTop =
            container.scrollHeight;


        try {

            const response =
                await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify({

                        message: message

                    })

                });


            const data =
                await response.json();


            document
                .getElementById("loading")
                ?.remove();


            if (
                response.ok &&
                data.reply
            ) {

                appendMessage(
                    data.reply,
                    "bot"
                );


                currentChat.messages.push({

                    role: "bot",
                    text: data.reply

                });

            }

            else {

                appendMessage(

                    "ఎర్రర్: " +

                    (
                        data.detail ||
                        "సమాధానం రాలేదు"
                    ),

                    "bot"

                );

            }

        }


        catch(error) {

            document
                .getElementById("loading")
                ?.remove();


            appendMessage(

                "నెట్‌వర్క్ లోపం: " +
                error.message,

                "bot"

            );

        }

    }

</script></body>
